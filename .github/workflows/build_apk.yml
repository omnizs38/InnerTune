name: Build APK

# Manually build an installable APK.
# Run it from the GitHub "Actions" tab -> "Build APK" -> "Run workflow",
# then download the artifact at the bottom of the finished run.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which build to produce'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Build release APK (unsigned)
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InnerTune-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
